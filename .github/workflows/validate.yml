name: Validate beta
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run smoke
      - run: npm run check:release
      - run: npm audit
      - run: npm run package
      - run: npm run smoke:package
      - name: Check packaged files
        shell: bash
        run: |
          found=0
          while IFS= read -r -d '' archive; do
            node scripts/check-release.cjs "$archive"
            found=1
          done < <(find dist -name app.asar -print0)
          test "$found" = 1
      - run: npm run archive
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: orbita-${{ runner.os }}-${{ runner.arch }}
          path: |
            dist/**/*.zip
            dist/**/*.sha256
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: smoke-${{ runner.os }}
          path: screenshots/
          if-no-files-found: ignore
